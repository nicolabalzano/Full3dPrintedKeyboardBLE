CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Forward the selected host's Caps Lock status to the right-half display.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_KEYBOARD_NAME="CustomBLE"
CONFIG_ZMK_BLE=y
CONFIG_BT_EXT_ADV=y
# Identity 0 is reserved for split scanning; the five host profiles use 1..5.
CONFIG_BT_ID_MAX=6
CONFIG_ZMK_USB=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display SSD1306 0.91" 128x32
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Keep the display's original default small font consistent across both halves.
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_12=y
CONFIG_I2C=y
CONFIG_SSD1306=y

CONFIG_NFCT_PINS_AS_GPIOS=y
# Potenza BLE a 0 dBm per prolungare la durata della batteria
CONFIG_BT_CTLR_TX_PWR_0=y

# Passkey/MITM disabilitato: Windows e BlueZ gestiscono diversamente i bond,
# con MITM attivo BlueZ forza il re-pair ad ogni switch di OS
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Risparmio energetico: solo blanking dello schermo (Deep Sleep disattivato per bug ZMK)
CONFIG_ZMK_IDLE_TIMEOUT=30000

